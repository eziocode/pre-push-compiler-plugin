name: Snapshot usage stats

# Pulls aggregate totals from the Catalyst stats function and commits them to
# docs/ (GitHub Pages fallback + shields.io endpoint badges).
# Configure: Settings → Secrets and variables → Actions → Variables →
#   STATS_TOTALS_URL = https://crmqaautomation-60066298984.development.catalystserverless.in/server/prepush_stats/totals

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch totals
        id: fetch
        env:
          TOTALS_URL: ${{ vars.STATS_TOTALS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TOTALS_URL}" ]; then
            echo "::notice::STATS_TOTALS_URL repository variable not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 \
            -H 'Accept: application/json' "${TOTALS_URL}" -o /tmp/totals.json
          # Validate shape: every field a non-negative integer.
          jq -e '
            [.users, .compilesOk, .blocked, .issuesCaught, .timeouts]
            | all(type == "number" and . >= 0 and . == floor)
          ' /tmp/totals.json > /dev/null
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Write docs/stats.json and badges
        id: write
        if: steps.fetch.outputs.skip == 'false'
        run: |
          set -euo pipefail
          numbers='{users, compilesOk, blocked, issuesCaught, timeouts}'
          new=$(jq -c "$numbers" /tmp/totals.json)
          old=$(jq -c "$numbers" docs/stats.json 2>/dev/null || echo '{}')
          if [ "$new" = "$old" ]; then
            echo "Totals unchanged: $new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          jq --arg now "$now" "$numbers + {updatedAt: (.updatedAt // \$now)}" \
            /tmp/totals.json > docs/stats.json

          # Shields endpoint badges: https://shields.io/badges/endpoint-badge
          short='def short: if . >= 1000000 then ((. / 100000 | floor) / 10 | tostring) + "M"
                             elif . >= 1000 then ((. / 100 | floor) / 10 | tostring) + "k"
                             else tostring end;'
          badge() { # file label field color
            jq --arg label "$2" --arg color "$4" \
              "$short {schemaVersion: 1, label: \$label, message: (.$3 | short), color: \$color}" \
              /tmp/totals.json > "docs/badge-$1.json"
          }
          badge issues   "issues caught" issuesCaught orange
          badge compiles "compiles OK"   compilesOk   brightgreen
          badge users    "users"         users        blue
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.write.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stats.json docs/badge-*.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update usage stats snapshot"
          git push
